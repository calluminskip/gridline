name: Build 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries
        run: dkp-pacman -Syu --noconfirm 3ds-dev

      - name: Get the template Makefile
        run: |
          T=$(find /opt/devkitpro -type f -name Makefile -path "*sprites*" 2>/dev/null | head -n 1)
          if [ -z "$T" ]; then
            git clone --depth 1 https://github.com/devkitPro/3ds-examples /tmp/ex
            T=$(find /tmp/ex -type f -name Makefile -path "*sprites*" | head -n 1)
          fi
          echo "Using $T"
          cp "$T" Makefile

      - name: Build
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: gridline-3dsx
          path: "*.3dsx"
