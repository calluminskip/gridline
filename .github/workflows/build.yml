name: Build 3DSX

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries and examples
        run: dkp-pacman -Syu --noconfirm 3ds-dev 3ds-examples

      - name: Use the official sprites template Makefile
        run: cp /opt/devkitpro/examples/3ds/graphics/gfx2d/sprites/Makefile Makefile

      - name: Build
        run: make

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: gridline-3dsx
          path: "*.3dsx"
